services:
  trap21:
    build:
      context: .
      target: runtime
    container_name: trap21
    restart: unless-stopped
    environment:
      TRAP21_PUBLIC_HOST: ${TRAP21_PUBLIC_HOST:-127.0.0.1}
    ports:
      - "${TRAP21_LISTEN_HOST:-127.0.0.1}:21:2121"
      - "${TRAP21_LISTEN_HOST:-127.0.0.1}:30000-30009:30000-30009"
    volumes:
      - trap21-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

volumes:
  trap21-data:
