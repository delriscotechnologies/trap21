name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build runtime image
        run: docker build -f docker/Dockerfile --target runtime -t trap21:latest .

      - name: Validate Compose configuration
        run: docker compose -f docker/compose.yml config --quiet

      - name: Smoke test
        run: |
          trap 'echo "--- TRAP21 logs ---"; docker compose -f docker/compose.yml logs || true' ERR
          docker compose -f docker/compose.yml up --build --detach

          ready=0
          for attempt in $(seq 1 20); do
            echo "Readiness attempt $attempt"
            if curl --fail --silent --show-error --user "ftpuser:87654321" "ftp://127.0.0.1/pub/README.txt" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          echo "Testing upload"
          printf 'ci evidence\n' | curl --fail --silent --show-error \
            --user "ftpuser:87654321" --upload-file - \
            "ftp://127.0.0.1/incoming/ci-evidence.txt"

          echo "Checking containment and evidence"
          docker compose -f docker/compose.yml exec -T trap21 sh -c '
            test "$(id -u)" -ne 0 &&
            test -w /app/data &&
            test "$(stat -c %a /app/data)" = 700 &&
            test "$(stat -c %a /app/data/events.jsonl)" = 600 &&
            evidence="$(find /app/data/quarantine -type f -print -quit)" &&
            test -n "$evidence" &&
            test "$(stat -c %a "$evidence")" = 600 &&
            grep -q '"'"'"eventType"'"'":"'"'"UPLOAD"'"'"' /app/data/events.jsonl &&
            grep -q '"'"'"sha256"'"'"' /app/data/events.jsonl
          '

      - name: Tear down
        if: always()
        run: docker compose -f docker/compose.yml down --volumes
